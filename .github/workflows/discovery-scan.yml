name: Discovery scan

on:
  schedule:
    # Every 20 minutes, offset from the top of the hour to reduce delays.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobfinder-discovery-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call Render discovery endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is missing."
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output response.json \
            https://jobfinder-50iy.onrender.com/api/discovery/scheduled

          jq --exit-status '.ok == true or .skipped == true' response.json > /dev/null
          jq --compact-output '{scannedAt, skipped, jobsFound, changesFound, sourcesScanned, sourcesFailed, notifications, batchIndex, batchCount}' response.json
          jq --exit-status '.skipped == true or .notifications.enabled == true' response.json > /dev/null

  deliver:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out delivery code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Deliver queued Discord alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node --experimental-strip-types scripts/deliver-discord.ts
