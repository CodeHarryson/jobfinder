services:
  - type: web
    name: jobfinder
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
